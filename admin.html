<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin 後台 · 隱哈歌利 En-hakkore</title>
  <meta name="description" content="隱哈歌利內部後台，檢視奉獻紀錄。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preload" href="assets/fonts/ShiweiSiJiChun-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/FreightTextPro-Book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="admin">

<div data-include="icons"></div>
<div data-include="header"></div>

<main>
  <div class="admin-shell">

    <!-- ============================================================
         未登入視圖：使用 Google 登入
         ============================================================ -->
    <section class="admin-auth" id="loginView" hidden>
      <div class="admin-auth-card">
        <div class="hero-symbol"></div>
        <h1>後台登入</h1>
        <p class="lead">此頁僅供隱哈歌利管理者使用。請以獲授權的 Google 帳號登入。</p>
        <button class="btn btn-primary" id="btnGoogleLogin" type="button">
          使用 Google 登入
          <svg class="arr" width="16" height="14" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow"></use></svg>
        </button>
        <p class="admin-auth-err" id="loginErr" role="alert"></p>
      </div>
    </section>

    <!-- ============================================================
         登入後視圖：奉獻紀錄表格
         ============================================================ -->
    <section class="admin-panel" id="panelView" hidden>
      <header class="admin-header">
        <div>
          <div class="section-eyebrow">ADMIN · 後台</div>
          <!-- 標題右側 dropdown：切換表單來源（奉獻／志工／聯絡） -->
          <div class="admin-title-row">
            <h1 id="adminTitle">奉獻紀錄</h1>
            <select id="sourceSelect" class="admin-source-select" aria-label="切換表單來源">
              <option value="donations">奉獻 Donations</option>
              <option value="volunteers">志工報名 Volunteers</option>
              <option value="contacts">聯絡訊息 Contacts</option>
              <option value="subscribers">電子報訂閱 Subscribers</option>
            </select>
          </div>
          <p class="lead">
            共 <span id="rowCount">0</span> 筆
            · 登入者：<span id="currentUser" class="admin-user"></span>
          </p>
        </div>
        <div class="admin-header-actions">
          <button class="btn btn-primary" id="btnExport" type="button">
            匯出 CSV
            <svg class="arr" width="16" height="14" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow"></use></svg>
          </button>
          <button class="btn btn-ghost" id="btnLogout" type="button">登出</button>
        </div>
      </header>

      <!-- 友善錯誤訊息（例如無檢視權限） -->
      <p class="admin-notice" id="adminNotice" role="alert" hidden></p>

      <div class="admin-table-wrap">
        <table class="admin-table" id="adminTable">
          <thead id="adminHead"></thead>
          <tbody id="adminBody">
            <tr><td class="admin-empty">載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<div data-include="footer"></div>

<script src="assets/js/site.js"></script>

<!-- ============================================================
     Admin 資料層 — Firebase Auth（Google 登入）+ Firestore 讀取
     ------------------------------------------------------------
     真正的把關一律以 Firestore Rules 為準：
       - 只有白名單管理者（見 firestore.rules 的 isAdmin()）能 read
         donations 集合，非白名單帳號會收到 permission-denied。
     下方前端也存了一份白名單，但那只是「即時提示」用途，
     不具安全性作用（前端陣列可被任意繞過）。
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, query, orderBy, getDocs }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  // 共用 Firebase 設定（placeholder 值，實際安全性由 Firestore Rules + App Check 負責）
  import { firebaseConfig } from "./assets/js/firebase-config.js";

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  /* ╔══════════════════════════════════════════════╗
     ║  App Check（防機器人／垃圾請求）                            ║
     ║  取得 reCAPTCHA v3 site key 後，解除下方註解即可啟用。      ║
     ║  取得 site key 的步驟見專案根目錄的 FIREBASE_SETUP.md。     ║
     ╚══════════════════════════════════════════════╝ */
import { initializeAppCheck, ReCaptchaV3Provider }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider("6LcXU18tAAAAAG50yNTaHpCQlwnF8hZXJl1VydWr"),
  isTokenAutoRefreshEnabled: true
});

  // 前端白名單：僅供「即時提示」，與 firestore.rules 一致。
  // ⚠️ 這不是安全防線，真正的把關在 Firestore Rules。
  const ADMIN_EMAILS = [
    "einhakkore@gmail.com",
    "s949391@gmail.com"
  ];

  const NO_PERMISSION_MSG = "此帳號沒有檢視權限，請聯繫管理者。";

  // ============================================================
  //  表單來源設定（donations / volunteers / contacts）
  //  每個來源定義：Firestore 集合名、標題、CSV 檔名前綴、欄位。
  //  欄位 fmt 可選（金額、時間格式化）；cls 用於套用既有欄位樣式。
  // ============================================================
  function fmtAmount(v) {
    return (typeof v === "number") ? "NT$ " + v.toLocaleString("zh-TW") : esc(v);
  }
  function fmtTime(d) {
    return d ? d.toLocaleString("zh-TW") : "—";
  }

  const SOURCES = {
    donations: {
      title: "奉獻紀錄",
      csv:   "donations",
      empty: "目前沒有奉獻紀錄。",
      columns: [
        { key: "name",      label: "姓名" },
        { key: "date",      label: "轉帳日期" },
        { key: "amount",    label: "金額",     fmt: fmtAmount, raw: v => (typeof v === "number" ? v : "") },
        { key: "last5",     label: "末五碼" },
        { key: "phone",     label: "電話" },
        { key: "address",   label: "地址",     cls: "cell-message" },
        { key: "createdAt", label: "送出時間", fmt: fmtTime, time: true },
      ],
    },
    volunteers: {
      title: "志工報名",
      csv:   "volunteers",
      empty: "目前沒有志工報名紀錄。",
      columns: [
        { key: "name",      label: "姓名" },
        { key: "email",     label: "Email" },
        { key: "subject",   label: "主旨" },
        { key: "category",  label: "類別" },
        { key: "message",   label: "留言",     cls: "cell-message" },
        { key: "createdAt", label: "送出時間", fmt: fmtTime, time: true },
      ],
    },
    contacts: {
      title: "聯絡訊息",
      csv:   "contacts",
      empty: "目前沒有聯絡訊息。",
      columns: [
        { key: "name",      label: "姓名" },
        { key: "email",     label: "Email" },
        { key: "category",  label: "類別" },
        { key: "message",   label: "留言",     cls: "cell-message" },
        { key: "createdAt", label: "送出時間", fmt: fmtTime, time: true },
      ],
    },
    subscribers: {
      title: "電子報訂閱",
      csv:   "subscribers",
      empty: "目前沒有電子報訂閱者。",
      columns: [
        { key: "email",     label: "Email" },
        { key: "source",    label: "來源" },
        { key: "createdAt", label: "訂閱時間", fmt: fmtTime, time: true },
      ],
    },
  };

  // ---- DOM ----
  const $loginView = document.getElementById("loginView");
  const $panelView = document.getElementById("panelView");
  const $loginErr  = document.getElementById("loginErr");
  const $notice    = document.getElementById("adminNotice");
  const $head      = document.getElementById("adminHead");
  const $body      = document.getElementById("adminBody");
  const $count     = document.getElementById("rowCount");
  const $user      = document.getElementById("currentUser");
  const $title     = document.getElementById("adminTitle");
  const $source    = document.getElementById("sourceSelect");

  let currentSource = $source.value || "donations";
  let currentUser   = null;
  let rows          = [];

  document.getElementById("btnGoogleLogin")
    .addEventListener("click", async () => {
      $loginErr.textContent = "";
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        console.warn("Google 登入失敗", err);
        $loginErr.textContent = "登入失敗，請再試一次。";
      }
    });

  document.getElementById("btnLogout")
    .addEventListener("click", () => signOut(auth));

  // 切換表單來源 → 重新載入對應集合
  $source.addEventListener("change", () => {
    currentSource = $source.value;
    if (currentUser) loadData();
  });

  // ---- 依登入狀態切換視圖 ----
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      $loginView.hidden = true;
      $panelView.hidden = false;
      $user.textContent = user.email || "";
      loadData();
    } else {
      currentUser = null;
      $panelView.hidden = true;
      $loginView.hidden = false;
      rows = [];
    }
  });

  function showNotice(msg) {
    $notice.textContent = msg;
    $notice.hidden = false;
  }
  function hideNotice() {
    $notice.textContent = "";
    $notice.hidden = true;
  }

  function cfg() { return SOURCES[currentSource]; }
  function colCount() { return cfg().columns.length; }

  function renderHead() {
    $title.textContent = cfg().title;
    $head.innerHTML =
      "<tr>" + cfg().columns.map(c => `<th>${esc(c.label)}</th>`).join("") + "</tr>";
  }
  function bodyMessage(msg) {
    $body.innerHTML =
      `<tr><td colspan="${colCount()}" class="admin-empty">${esc(msg)}</td></tr>`;
  }

  async function loadData() {
    hideNotice();
    renderHead();
    bodyMessage("載入中…");
    $count.textContent = "0";
    rows = [];

    // 前端即時提示：非白名單帳號先給友善訊息（真正把關仍在 Rules）
    if (!ADMIN_EMAILS.includes(currentUser.email)) {
      showNotice(NO_PERMISSION_MSG);
      bodyMessage(NO_PERMISSION_MSG);
      return;
    }

    const source = currentSource;
    try {
      const snap = await getDocs(
        query(collection(db, source), orderBy("createdAt", "desc"))
      );
      // 使用者可能在載入期間又切換來源；只採用仍相符的結果
      if (source !== currentSource) return;
      rows = snap.docs.map(d => {
        const x = d.data();
        const row = {};
        cfg().columns.forEach(c => {
          if (c.time) row[c.key] = x[c.key]?.toDate?.() || null;
          else        row[c.key] = (x[c.key] != null) ? x[c.key] : "";
        });
        return row;
      });
      render();
    } catch (err) {
      if (source !== currentSource) return;
      console.warn(`讀取 ${source} 失敗`, err);
      if (err && err.code === "permission-denied") {
        showNotice(NO_PERMISSION_MSG);
        bodyMessage(NO_PERMISSION_MSG);
      } else {
        showNotice("讀取資料時發生錯誤，請稍後再試。");
        bodyMessage("讀取失敗。");
      }
    }
  }

  function render() {
    $count.textContent = rows.length;
    if (rows.length === 0) {
      bodyMessage(cfg().empty);
      return;
    }
    const cols = cfg().columns;
    $body.innerHTML = rows.map(r => "<tr>" + cols.map(c => {
      const val = c.fmt ? c.fmt(r[c.key]) : esc(r[c.key]);
      const cls = c.cls ? ` class="${c.cls}"` : "";
      return `<td data-label="${esc(c.label)}"${cls}>${val}</td>`;
    }).join("") + "</tr>").join("");
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  // ---- 匯出 CSV（純前端 Blob；含 UTF-8 BOM 避免 Excel 中文亂碼）----
  document.getElementById("btnExport").addEventListener("click", () => {
    if (rows.length === 0) return;
    const cols = cfg().columns;
    const headers = cols.map(c => c.label);
    const lines = rows.map(r => cols.map(c => {
      if (c.time)     return r[c.key] ? r[c.key].toISOString() : "";
      if (c.raw)      return c.raw(r[c.key]);
      return r[c.key];
    }).map(csvCell).join(","));
    const csv = "﻿" + [headers.join(","), ...lines].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `einhakkore-${cfg().csv}-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  function csvCell(v) {
    const s = String(v ?? "");
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }
</script>
</body>
</html>
