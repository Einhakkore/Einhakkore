<script>
  // 暫時密碼；上線後整個 gate 換 Firebase Auth + custom claim admin==true
  const ADMIN_PIN = "1111";
  const STORAGE_KEY = "enhakkore_admin_ok";
  const PANEL_URL = "admin-panel.html";

  const pin  = document.getElementById("adminPin");
  const btn  = document.getElementById("adminLogin");
  const err  = document.getElementById("adminGateErr");

  // 已登入過就直接跳面板
  if (localStorage.getItem(STORAGE_KEY) === "1") {
    location.replace(PANEL_URL);
  }

  function tryLogin() {
    if ((pin.value || "") === ADMIN_PIN) {
      localStorage.setItem(STORAGE_KEY, "1");
      location.href = PANEL_URL;
    } else {
      err.textContent = "密碼不正確，請再試一次。";
      pin.select();
    }
  }

  btn.addEventListener("click", tryLogin);
  pin.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); tryLogin(); }
  });
</script>
