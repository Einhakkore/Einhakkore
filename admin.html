<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin 登入 · 隱哈歌利 En-hakkore</title>
  <meta name="description" content="隱哈歌利內部後台。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preload" href="assets/fonts/ShiweiSiJiChun-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/FreightTextPro-Book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="admin">

<div data-include="icons"></div>
<div data-include="header"></div>

<main>
  <div class="admin-shell">
    <!--
      ============================================================
      Admin 登入頁 — 只做密碼 gate
      成功後：寫 localStorage flag → 導向 admin-panel.html
      失敗後：不進面板頁，維持在此頁
      TODO（上線前必補）：
        1. 目前只是「前端 password gate」（PIN 存在 localStorage），
           檔案本身可下載即可看，只擋一般人不擋技術者。
           上線一定要換成 Firebase Authentication（Email + Password
           或 Google Sign-In）+ Firestore Rules `request.auth.token.admin==true`
           才擋得住。
        2. Firestore Rules 未收緊前，不要把 admin.html / admin-panel.html
           上到 GitHub Pages 對外環境，或用 Cloudflare Access 擋整條
           /admin 路徑。
      ============================================================
    -->
    <section class="admin-gate">
      <div class="admin-gate-card">
        <div class="hero-symbol"></div>
        <h1>後台登入</h1>
        <p class="lead">此頁僅供隱哈歌利同工使用。</p>
        <label class="field">
          <span>管理員密碼</span>
          <input type="password" id="adminPin" autocomplete="current-password" placeholder="請輸入密碼">
        </label>
        <button class="btn btn-primary" id="adminLogin" type="button">
          進入後台
          <svg class="arr" width="16" height="14" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow"></use></svg>
        </button>
        <p class="admin-gate-err" id="adminGateErr" role="alert"></p>
      </div>
    </section>
  </div>
</main>

<div data-include="footer"></div>

<script src="assets/js/site.js"></script>

<script>
  // 暫時密碼；上線後整個 gate 換 Firebase Auth + custom claim admin==true
  const ADMIN_PIN = "1111";
  const STORAGE_KEY = "enhakkore_admin_ok";
  const PANEL_URL = "admin-panel.html";

  const pin  = document.getElementById("adminPin");
  const btn  = document.getElementById("adminLogin");
  const err  = document.getElementById("adminGateErr");

  // 已登入過就直接跳面板
  if (localStorage.getItem(STORAGE_KEY) === "1") {
    location.replace(PANEL_URL);
  }

  function tryLogin() {
    if ((pin.value || "") === ADMIN_PIN) {
      localStorage.setItem(STORAGE_KEY, "1");
      location.href = PANEL_URL;
    } else {
      err.textContent = "密碼不正確，請再試一次。";
      pin.select();
    }
  }

  btn.addEventListener("click", tryLogin);
  pin.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); tryLogin(); }
  });
</script>
</body>
</html>
