<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聯絡我們 · 隱哈歌利 En-hakkore</title>
  <meta name="description" content="隱哈歌利 En-hakkore — 為宣教士提供支持與關懷的網絡。求告者之泉。">
  <link rel="icon" href="assets/img/logo-on-light.png">
  <link rel="preload" href="assets/fonts/ShiweiSiJiChun-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/FreightTextPro-Book.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">

<body data-page="contact">

<div data-include="aurora"></div>

<div data-include="header"></div>

<main>

<section class="page-hero">
  <div class="symbol-sm"></div>
  <div class="eyebrow">CONTACT · 聯絡我們</div>
  <h1>與我們<em>聯繫</em></h1>
  <p>如果您願意進一步認識隱哈歌利，或想討論合作的可能，<br>請留下訊息，我們會在三個工作天內回覆。</p>
</section>

<section class="section">
  <div class="wrap">
    <div class="contact-page">

      <div class="contact-info reveal">
        <div class="help-guides" style="display:flex;flex-direction:column;gap:14px;">
          <div class="info-text" style="margin-bottom:4px;">
            <h4 style="font-family:var(--font-brand);font-weight:500;font-size:17px;color:var(--fg);margin:0 0 8px;letter-spacing:.02em;line-height:1.55;">我們如何協助您？</h4>
            <p style="font-size:15px;line-height:1.85;color:var(--fg);opacity:.82;margin:0;">每一則訊息我們都會用心閱讀，回覆將會在 1~3 個工作天送出。</p>
          </div>

          <button type="button" class="contact-block guide-card" data-category="👋 想更多了解隱哈哥利" data-placeholder="跟我們分享您想認識這間教會什麼，或第一次來訪的期待。" aria-pressed="false" style="background:transparent;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;width:100%;">
            <div class="icon" aria-hidden="true" style="font-size:22px;">👋</div>
            <div class="info-text">
              <h4>第一次來</h4>
              <p>想瞭解更多關於隱哈哥利</p>
            </div>
          </button>

          <button type="button" class="contact-block guide-card" data-category="代禱請求" data-placeholder="請自在地分享您的代禱事項，我們會以極大的尊重與保密之心對待每則訊息。" aria-pressed="false" style="background:transparent;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;width:100%;">
            <div class="icon" aria-hidden="true" style="font-size:22px;">❤️</div>
            <div class="info-text">
              <h4>代禱請求</h4>
              <p>讓我們來為你禱告</p>
            </div>
          </button>

          <button type="button" class="contact-block guide-card" data-category="合作邀約" data-placeholder="請告訴我們您想合作的想法、活動或機構。" aria-pressed="false" style="background:transparent;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;width:100%;">
            <div class="icon" aria-hidden="true" style="font-size:22px;">🤝</div>
            <div class="info-text">
              <h4>合作邀約</h4>
              <p>我想要與隱哈哥利合作</p>
            </div>
          </button>

          <button type="button" class="contact-block guide-card" data-category="想參加聚會活動" data-placeholder="您對哪一場聚會活動有興趣？我們很樂意協助。" aria-pressed="false" style="background:transparent;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;width:100%;">
            <div class="icon" aria-hidden="true" style="font-size:22px;">🎉</div>
            <div class="info-text">
              <h4>想參加聚會活動</h4>
              <p>我想要參與活動</p>
            </div>
          </button>

          <button type="button" class="contact-block guide-card" data-category="💬 其他問題" data-placeholder="留下您任何的問題或想法。" aria-pressed="false" style="background:transparent;border:0;padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer;width:100%;">
            <div class="icon" aria-hidden="true" style="font-size:22px;">💬</div>
            <div class="info-text">
              <h4>其他問題</h4>
              <p>有任何其他問題歡迎詢問</p>
            </div>
          </button>
        </div>

        <div class="contact-block">
          <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></div>
          <div class="info-text">
            <h4>Email</h4>
            <p><a href="mailto:einhakkore@gmail.com">einhakkore@gmail.com</a></p>
          </div>
        </div>

        <div class="contact-block">
          <div class="icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg></div>
          <div class="info-text">
            <h4>社群</h4>
      <div class="footer-social">
        <a href="#" aria-label="Facebook"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.5 9.9V14.9H8v-2.9h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.3.2 2.3.2v2.5h-1.3c-1.3 0-1.7.8-1.7 1.6V12h2.9l-.5 2.9h-2.4v6.9A10 10 0 0 0 22 12z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor"/></svg></a>
        <a href="#" aria-label="YouTube"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.7 3.6 12 3.6 12 3.6s-7.7 0-9.4.5A3 3 0 0 0 .5 6.2C0 7.9 0 12 0 12s0 4.1.5 5.8a3 3 0 0 0 2.1 2.1c1.7.5 9.4.5 9.4.5s7.7 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.7.5-5.8.5-5.8s0-4.1-.5-5.8zM9.6 15.3V8.7l6.4 3.3-6.4 3.3z"/></svg></a>
      </div>
          </div>
        </div>
      </div>
            <div class="reveal">
        <form class="contact-form">
        <h3>給我們寫封信</h3>
        <p class="desc">所有訊息會直接送到我們的同工信箱。</p>
        <div class="field-row">
          <div class="field"><label>姓 Last name</label><input type="text" placeholder="您的姓氏" required></div>
          <div class="field"><label>名 First name</label><input type="text" placeholder="您的名字" required></div>
        </div>
        <div class="field"><label>Email 電子郵件</label><input type="email" placeholder="example@church.org" required></div>
        <div class="field"><label>主旨 Subject</label>
            <select id="contact-category">
              <option>👋 想更多了解隱哈哥利</option>
              <option>代禱請求</option>
              <option>合作邀約</option>
              <option>想參加聚會活動</option>
              <option>💬 其他問題</option>
            </select>
        </div>
        <div class="field"><label>留言 Message</label><textarea id="contact-message" placeholder="想對我們說的話…" required></textarea></div>
        <button class="btn btn-primary" type="submit" style="margin-top:8px;align-self:flex-start;">送出 <svg class="arr" width="16" height="14" viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h12m-5-5 5 5-5 5"/></svg></button>
    </form>
      </div>

    </div>
  </div>
</section>
