<!-- =========================================================
     聯絡表單 — Firebase 串接
     送出後寫入 Firestore「contacts」集合。
     App Check（reCAPTCHA v3）會為每個請求簽發 token，
     Firestore 只接受帶有合法 token 的寫入，擋掉機器人。
     ========================================================= -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { initializeAppCheck, ReCaptchaV3Provider }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js";
  // 共用 Firebase 設定（placeholder 值，實際安全性由 Firestore Rules + App Check 負責）
  import { firebaseConfig } from "./assets/js/firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  // App Check（防機器人／垃圾寫入）— 與 donate.html 使用同一把 reCAPTCHA v3 site key。
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider("6LcXU18tAAAAAG50yNTaHpCQlwnF8hZXJl1VydWr"),
    isTokenAutoRefreshEnabled: true
  });

  const form      = document.getElementById("contactForm");
  const statusEl  = document.getElementById("contactStatus");
  const submitBtn = document.getElementById("contactSubmit");

  function setStatus(msg, type){
    statusEl.textContent = msg;
    statusEl.className = "form-status show " + type;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const fd = new FormData(form);

    // honeypot：真人不會填 website 這欄，若被填 → 判定為機器人並靜默丟棄
    if ((fd.get("website") || "").trim() !== "") {
      return;
    }

    // 寫入的欄位需與 firestore.rules 的允許清單完全一致。
    const data = {
      name:     (fd.get("name")     || "").trim(),
      email:    (fd.get("email")    || "").trim(),
      category: (fd.get("category") || "").trim(),
      message:  (fd.get("message")  || "").trim(),
    };

    if (!fd.get("consent")) {
      setStatus("請勾選同意隱私權及服務條款。", "err");
      return;
    }
    if (!data.name || !data.email || !data.message) {
      setStatus("請確認姓名、Email 與留言等必填欄位是否完整。", "err");
      return;
    }

    submitBtn.disabled = true;
    setStatus("送出中…", "ok");

    try {
      await addDoc(collection(db, "contacts"), {
        ...data,
        createdAt: serverTimestamp(),
        source: "contact.html"
      });
      form.reset();
      setStatus("感謝您的來信，我們收到了！我們將會與您聯繫。", "ok");
    } catch (err) {
      console.error(err);
      setStatus("送出失敗，請稍後再試，或直接來信 einhakkore@gmail.com。", "err");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
